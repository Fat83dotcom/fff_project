<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./assets/css/style.css" />
    <title>Aluno</title>
  </head>
  <body>
    <header>
      <nav>
        <a href="index.html">Home</a>
        <a href="student.html">Alunos</a>
        <a href="module.html">Matéria</a>
        <a href="grade_report.html">Boletim</a>
      </nav>
    </header>
    <div class="container">
      <h1>Boletim</h1>
      <form id="grade-report-form">
        <label for="student">Aluno:</label>
        <select id="student" name="student" required></select>

        <label for="modules">Matérias:</label>
        <select id="modules" name="modules" multiple required></select>

        <label for="academic_year">Ano Letivo:</label>
        <input
          type="text"
          id="academic_year"
          name="academic_year"
          maxlength="4"
          required
        />

        <label for="semester">Semestre:</label>
        <select id="semester" name="semester" required>
          <option value="1">1º Semestre</option>
          <option value="2">2º Semestre</option>
        </select>

        <button type="submit">Salvar Boletim</button>
        <p id="grade-message" class="hidden"></p>
      </form>
    </div>

    <hr />

    <h2>Boletim</h2>
    <button id="refresh-button" type="button" onclick="loadStudents()">
      🔄 Atualizar Lista de Alunos
    </button>

    <table id="students-table">
      <thead>
        <tr>
          <th>Nome</th>
        </tr>
      </thead>
      <tbody>
        <!-- Os dados serão inseridos aqui via JavaScript -->
      </tbody>
    </table>

    <script src="./assets/js/student_script.js"></script>
  </body>
</html>

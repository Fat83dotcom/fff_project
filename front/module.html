<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./assets/css/style.css" />
    <title>Matéria</title>
  </head>
  <body>
    <header>
      <nav>
        <a href="index.html">Home</a>
        <a href="student.html">Alunos</a>
        <a href="module.html">Matéria</a>
        <a href="grade_report.html">Boletim</a>
      </nav>
    </header>
    <div class="container">
      <h1>Cadastro de Matéria</h1>
      <form id="modules-form">
        <label for="name">Nome:</label>
        <input type="text" id="name" name="name" required maxlength="100" />

        

        <button type="submit">Salvar</button>
        <p id="message" class="hidden"></p>
      </form>
    </div>

    <hr />

    <h2>Matérias Cadastradas</h2>
    <button id="refresh-button" type="button" onclick="loadModules()">
      🔄 Atualizar Lista de Matérias
    </button>

    <table id="modules-table">
      <thead>
        <tr>
          <th>Nome</th>
        </tr>
      </thead>
      <tbody>
        <!-- Os dados serão inseridos aqui via JavaScript -->
      </tbody>
    </table>

    <script src="./assets/js/modules_script.js"></script>
  </body>
</html>
